[mgr]
show_hidden = true

[opener]
browser = [
	{ run = "waterfox %s", orphan = true, for = "unix", desc = "Open with browser" }
]
edit = [
	{ run = "nvim %s", block = true, for = "unix", desc = "Edit" }
]
play = [
	{ run = "mpv --force-window %s", orphan = true, for = "unix", desc = "Play in MPV" }
]

[open]
rules = [
	{ url = "*flamegraph.svg", use = [ "browser", "open" ] },
	{ mime = "image/*", use = [ "open" ] },
	{ mime = "text/*", use = [ "edit" ] },
	{ mime = "application/wine-extension-ini", use = [ "edit" ] },
	{ mime = "application/json", use = [ "edit" ] },
	{ mime = "video/*", use = [ "play" ] },
	{ mime = "audio/*", use = [ "play" ] }
]
